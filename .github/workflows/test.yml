name: Run Tests (swift test)

on: push

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  app-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: |
          mkdir -p .out
          swift test --enable-code-coverage --xunit-output .out/junit.xml

      - name: Export coverage
        if: always()
        run: |
          BINPATH=$(swift build --show-bin-path)
          BINARY="$BINPATH/testcontainers-swiftPackageTests"
          PROFDATA="$BINPATH/codecov/default.profdata"
          if [ -f "$PROFDATA" ]; then
            llvm-cov export -format=lcov "$BINARY" -instr-profile "$PROFDATA" > .out/lcov.info
          fi

      - name: Generate coverage report
        if: always()
        uses: mridang/action-test-reporter@v3
        with:
          results-path: '.out/junit-swift-testing.xml'
          coverage-path: '.out/lcov.info'
